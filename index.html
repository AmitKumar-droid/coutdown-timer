<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav><a href="#">Web site Creator</a></nav>
        <div class="container">
            <h1 id="headline">Our Website is almost ready</h1>
            <div id="countdown" class="countdown">
                <ul>
                    <li><span id="days">00</span>Days</li>
                    <li><span id="hours">00</span>Hours</li>
                    <li><span id="separate">:</span></li>
                    <li><span id="minutes">00</span>Minutes</li>
                    <li><span id="separate">:</span></li>
                    <li><span id="seconds">00</span>Seconds</li>
                </ul>
            </div>
        </div>



        <script src="script.js" defer></script>
    
    
</body>
</html>
